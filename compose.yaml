name: slkapp
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    init: true
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8002:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
